name: Update feeds and deploy site

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6:00 UTC
  push:
    paths:
      - "sources.txt"
      - "scripts/*.py"
      - "templates/*.html"
      - "static/**"
      - "requirements.txt"
    branches:
      - main
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-

      - name: Install deps
        run: make venv

      - name: Download fonts
        run: make fonts

      - name: Validate configuration
        run: |
          source .venv/bin/activate
          python -c "
          import json
          from pathlib import Path
          
          # Validate discovery config
          config_file = Path('discovery_config.json')
          if config_file.exists():
              with open(config_file) as f:
                  config = json.load(f)
                  print(f'✅ Discovery config loaded: {len(config)} sections')
          else:
              print('⚠️  Using default discovery config')
          
          # Validate sources
          sources_file = Path('sources.txt')
          if sources_file.exists():
              sources = sources_file.read_text().strip().split('\n')
              sources = [s for s in sources if s.strip() and not s.startswith('#')]
              print(f'✅ Found {len(sources)} RSS sources')
          else:
              raise FileNotFoundError('sources.txt not found')
          "

      - name: Download previous feed cache
        uses: dawidd6/action-download-artifact@v21
        with:
          name: feed-cache
          workflow: update.yml
          branch: main
          if_no_artifact_found: warn
          path: .

      - name: Fetch feeds
        timeout-minutes: 20
        run: |
          # Save previous cache as fallback
          if [ -f "feed_cache.json" ]; then
            cp feed_cache.json feed_cache.json.prev
            echo "📦 Previous cache restored ($(wc -c < feed_cache.json) bytes)"
          fi
          
          # Run fetch with error handling
          if make fetch; then
            echo "✅ Feeds fetched successfully"
          else
            echo "⚠️ Feed fetching encountered errors"
            if [ -f "feed_cache.json.prev" ]; then
              mv feed_cache.json.prev feed_cache.json
              echo "📦 Restored previous cache"
            fi
          fi
          
          # Ensure cache exists
          if [ ! -f "feed_cache.json" ]; then
            echo "❌ No feed cache available, cannot proceed"
            exit 1
          fi
          
          echo "📦 Cache size: $(wc -c < feed_cache.json) bytes"
          python3 -c "
          import json
          with open('feed_cache.json') as f:
              cache = json.load(f)
          total = sum(len(s['entries']) for s in cache['sites'])
          has_content = sum(1 for s in cache['sites'] for e in s['entries'] if e.get('content'))
          failed = len(cache.get('failed_feeds', []))
          pct = (has_content / total * 100) if total else 0
          print(f'📄 Posts: {total} | Content extracted: {has_content}/{total} ({pct:.0f}%) | Failed feeds skipped: {failed}')
          "

      - name: Generate site
        run: make build

      - name: Quick feed validation
        run: |
          source .venv/bin/activate
          python scripts/validate_feeds.py --max-feeds 3 --no-age-check --soft-fail --report quick-feed-validation.json

      - name: Show feed statistics
        run: |
          source .venv/bin/activate
          python scripts/test_discovery.py | head -20

      - name: Validate generated site
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "❌ Site generation failed - index.html not found"
            exit 1
          fi
          
          if [ ! -f "public/about.html" ]; then
            echo "❌ Site generation failed - about.html not found"
            exit 1
          fi
          
          echo "✅ Site generated successfully"
          ls -la public/

      - name: Upload feed cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: feed-cache
          path: feed_cache.json
          retention-days: 7
          overwrite: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
